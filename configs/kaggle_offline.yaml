# Kaggle Offline Competition Configuration
model:
  backend: vllm
  vllm_gpu_memory_utilization: 0.85
  vllm_enforce_eager: true
  model_id: "/kaggle/input" # Auto-locator will scan for Gemma-4-26B / NVFP4 safetensors
  device: "cuda:0"
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"
  max_context_length: 131072
  trust_remote_code: true
  temperature: 0.0
  top_p: 0.95
  repeat_penalty: 1.0
  max_new_tokens_eye: 384
  max_new_tokens_brain: 1024
  brain_enable_thinking: true
  brain_review_max_tokens: 2048

agent:
  stuck_threshold: 3
  consecutive_action_threshold: 5
  max_iterations_per_level: 3
  max_levels_per_game: 10
  speculative_plan_max_steps: 0
  time_budget_hours: 8.2
  memory_root: "/kaggle/working/agent_memory"
  vision_cache_dir: "/tmp/agent_vision"
  max_total_actions_per_game: null

environment:
  mode: "auto" # Checks KAGGLE_IS_COMPETITION_RERUN
  environments_dir: "/kaggle/input/arc-prize-2026-arc-agi-3/environment_files"
  base_url: "http://gateway:8001/"
  submission_parquet: "/kaggle/working/submission.parquet"
