# Default Configuration for Single RTX PRO 6000 (96GB VRAM)
model:
  model_id: "nvidia/Gemma-4-26B-A4B-NVFP4"
  fallback_model_ids:
    - "google/gemma-4-26b-a4b"
    - "google/gemma-3-27b-it"
    - "Qwen/Qwen2.5-VL-7B-Instruct"
  device: "cuda:0"
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa" # Or "flash_attention_2"
  max_context_length: 8192
  trust_remote_code: true
  temperature: 0.1
  top_p: 0.95
  max_new_tokens_eye: 1024
  max_new_tokens_debug: 512
  max_new_tokens_brain: 256
  max_new_tokens_review: 768

agent:
  stuck_threshold: 3
  consecutive_action_threshold: 5
  max_iterations_per_level: 5
  max_levels_per_game: 10
  speculative_plan_max_steps: 15
  time_budget_hours: 8.5
  memory_root: "./agent_memory"
  vision_cache_dir: "/tmp/agent_vision"

environment:
  mode: "offline" # "offline" or "competition"
  environments_dir: "/kaggle/input/arc-prize-2026-arc-agi-3/environment_files"
  base_url: "http://gateway:8001/"
  submission_parquet: "./submission.parquet"
