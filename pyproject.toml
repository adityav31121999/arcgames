[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-agent"
version = "0.1.0"
description = "LangChain-powered ARC-AGI-3 Agent for ARC Prize 2026 using Gemma-4-26B-A4B with Hugging Face Transformers"
authors = [{ name = "ARC Competitor" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.48.0",
    "accelerate>=0.28.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "diskcache>=5.6.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
gpu-extra = [
    "bitsandbytes>=0.43.0",
    "flash-attn>=2.5.0",
]

[project.scripts]
arc-agent = "arc_agent.scripts.run_inference:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

